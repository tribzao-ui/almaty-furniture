<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Проектируем, изготавливаем и устанавливаем — без нервов и переделок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.08;
    pointer-events: none;
  }
</style>

</head>
<body id="page" class="min-h-screen flex items-center justify-center text-white">

  <div class="text-center px-6 max-w-xl">
    <h1 id="title" class="text-4xl md:text-5xl font-bold mb-4">
      Мебель от Айдара под заказ в Алматы
    </h1>

    <p class="text-lg opacity-90 mb-8">
      Проектирование, изготовление и установка
    </p>

    <a
      href="https://wa.me/7700XXXXXXX?text=Хочу мебель под заказ"
      class="inline-flex items-center gap-2 bg-white text-black px-10 py-5 rounded-2xl text-lg font-semibold shadow-xl hover:scale-105 transition"
    >
      Рассчитать стоимость
    </a>

    <div class="mt-8 text-sm opacity-75">
      Бесплатный замер · Работаем по договору · Изготовление от 10 дней
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const room = params.get('room')

    const page = document.getElementById('page')
    const title = document.getElementById('title')

    page.classList.add('bg-neutral-900')

    if (room === 'kitchen') {
      page.className = page.className.replace('bg-neutral-900', '')
      page.classList.add('bg-gradient-to-r', 'from-orange-600', 'to-red-500')
      title.innerText = 'Кухня, которая идеально встанет в ваш дом'
    }

    if (room === 'wardrobe') {
      page.className = page.className.replace('bg-neutral-900', '')
      page.classList.add('bg-gradient-to-r', 'from-gray-700', 'to-gray-900')
      title.innerText = 'Шкаф под ваше пространство, а не под каталог'
    }

    if (room === 'bedroom') {
      page.className = page.className.replace('bg-neutral-900', '')
      page.classList.add('bg-gradient-to-r', 'from-indigo-600', 'to-purple-600')
      title.innerText = 'Спальня, в которой хочется отдыхать'
    }
  </script>

</body>
</html>
